<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Fredoka One', 'Arial Black', Arial, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Animated Background */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* Floating particles canvas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Screen Management */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* ==================== MAIN MENU ==================== */
        #main-menu {
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 25%, #0f3460 50%, #1a1a2e 75%, #16213e 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .menu-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* Glowing Title */
        .gd-title {
            text-align: center;
            animation: titleFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.5));
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title-geo {
            font-size: 52px;
            color: #00ffcc;
            text-shadow:
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #00ffcc,
                0 0 80px #00ffcc,
                0 5px 0 #008866;
            letter-spacing: 8px;
            animation: neonFlicker 3s ease-in-out infinite;
        }

        .title-dash {
            font-size: 78px;
            color: #fff200;
            text-shadow:
                0 0 10px #fff200,
                0 0 20px #fff200,
                0 0 40px #ff8c00,
                0 0 80px #ff8c00,
                0 5px 0 #cc9900;
            letter-spacing: 4px;
            margin-top: -15px;
            animation: neonPulse 2s ease-in-out infinite;
        }

        @keyframes neonFlicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; }
            94% { opacity: 1; }
            95% { opacity: 0.9; }
            96% { opacity: 1; }
        }

        @keyframes neonPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        /* Menu Buttons */
        .menu-buttons {
            display: flex;
            gap: 25px;
            perspective: 1000px;
        }

        .gd-button {
            position: relative;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .gd-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .gd-button:hover::before {
            left: 100%;
        }

        .gd-button::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            border-radius: 12px 12px 50% 50%;
            pointer-events: none;
        }

        .play-btn {
            width: 120px;
            height: 120px;
            background: linear-gradient(180deg, #50ff50 0%, #30dd30 30%, #20bb20 70%, #10aa10 100%);
            box-shadow:
                0 8px 0 #0a7010,
                0 10px 20px rgba(0,0,0,0.5),
                0 0 30px rgba(80, 255, 80, 0.5),
                inset 0 -5px 20px rgba(0,0,0,0.2);
            font-size: 48px;
            border: 4px solid rgba(255,255,255,0.8);
            animation: playPulse 2s ease-in-out infinite;
        }

        @keyframes playPulse {
            0%, 100% { box-shadow: 0 8px 0 #0a7010, 0 10px 20px rgba(0,0,0,0.5), 0 0 30px rgba(80, 255, 80, 0.5); }
            50% { box-shadow: 0 8px 0 #0a7010, 0 10px 20px rgba(0,0,0,0.5), 0 0 60px rgba(80, 255, 80, 0.8); }
        }

        .play-btn:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow:
                0 12px 0 #0a7010,
                0 15px 30px rgba(0,0,0,0.6),
                0 0 50px rgba(80, 255, 80, 0.8);
        }

        .play-btn:active {
            transform: scale(0.95) translateY(5px);
            box-shadow: 0 2px 0 #0a7010, 0 5px 10px rgba(0,0,0,0.4);
        }

        .icon-btn, .settings-btn {
            width: 80px;
            height: 80px;
            background: linear-gradient(180deg, #60a0ff 0%, #4080dd 30%, #3060bb 70%, #2050aa 100%);
            box-shadow:
                0 6px 0 #103080,
                0 8px 15px rgba(0,0,0,0.4),
                0 0 20px rgba(96, 160, 255, 0.4);
            font-size: 28px;
            border: 3px solid rgba(255,255,255,0.7);
        }

        .icon-btn:hover, .settings-btn:hover {
            transform: scale(1.12) translateY(-3px);
            box-shadow:
                0 10px 0 #103080,
                0 12px 25px rgba(0,0,0,0.5),
                0 0 40px rgba(96, 160, 255, 0.6);
        }

        /* Bottom buttons */
        .menu-bottom {
            display: flex;
            gap: 15px;
        }

        .small-btn {
            width: 55px;
            height: 55px;
            background: linear-gradient(180deg, #aa66ff 0%, #8844dd 50%, #6622bb 100%);
            box-shadow: 0 4px 0 #441188, 0 0 15px rgba(170, 102, 255, 0.4);
            border-radius: 12px;
            border: 3px solid rgba(255,255,255,0.6);
            font-size: 22px;
        }

        .small-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 0 #441188, 0 0 30px rgba(170, 102, 255, 0.6);
        }

        /* Ground Animation */
        .ground-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            overflow: hidden;
        }

        .ground-layer {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100%;
            background:
                linear-gradient(180deg, transparent 0%, rgba(45, 27, 78, 0.8) 20%, #2d1b4e 20%),
                repeating-linear-gradient(90deg,
                    #2d1b4e 0px, #2d1b4e 60px,
                    #3d2b6e 60px, #3d2b6e 120px);
            animation: groundScroll 3s linear infinite;
        }

        .ground-layer::before {
            content: '';
            position: absolute;
            top: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            animation: rainbowLine 2s linear infinite;
            box-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
        }

        @keyframes groundScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes rainbowLine {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ==================== LEVEL SELECT ==================== */
        #level-select {
            background: linear-gradient(180deg, #1a0033 0%, #2d0066 30%, #1a0033 60%, #330066 100%);
            background-size: 100% 200%;
            animation: bgScroll 10s ease infinite;
        }

        @keyframes bgScroll {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 0% 100%; }
        }

        .screen-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-button {
            width: 55px;
            height: 55px;
            background: linear-gradient(180deg, #ff6655 0%, #dd4433 50%, #bb2211 100%);
            border: 3px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-size: 28px;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #881100, 0 0 15px rgba(255, 100, 80, 0.5);
            transition: all 0.2s;
        }

        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 0 #881100, 0 0 30px rgba(255, 100, 80, 0.7);
        }

        .screen-title {
            color: white;
            font-size: 32px;
            text-shadow:
                0 0 10px #ff00ff,
                0 0 20px #ff00ff,
                0 4px 0 #660066;
            letter-spacing: 4px;
        }

        /* Level Carousel */
        .level-carousel {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .carousel-arrow {
            width: 60px;
            height: 60px;
            background: linear-gradient(180deg, #5588ff 0%, #3366dd 50%, #2244bb 100%);
            border: 3px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #112288, 0 0 20px rgba(85, 136, 255, 0.5);
            transition: all 0.2s;
        }

        .carousel-arrow:hover {
            transform: scale(1.15);
            box-shadow: 0 6px 0 #112288, 0 0 40px rgba(85, 136, 255, 0.7);
        }

        .level-card {
            width: 380px;
            background: linear-gradient(180deg, rgba(60, 30, 100, 0.9) 0%, rgba(30, 15, 60, 0.95) 100%);
            border: 4px solid;
            border-image: linear-gradient(180deg, #ff00ff, #00ffff) 1;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            color: white;
            box-shadow:
                0 0 30px rgba(255, 0, 255, 0.3),
                0 0 60px rgba(0, 255, 255, 0.2),
                inset 0 0 50px rgba(0, 0, 0, 0.5);
            animation: cardGlow 3s ease-in-out infinite;
        }

        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 0, 255, 0.3), 0 0 60px rgba(0, 255, 255, 0.2); }
            50% { box-shadow: 0 0 50px rgba(255, 0, 255, 0.5), 0 0 80px rgba(0, 255, 255, 0.4); }
        }

        .level-preview {
            width: 100%;
            height: 140px;
            border-radius: 15px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .level-preview-bg {
            width: 100%;
            height: 100%;
            animation: previewScroll 20s linear infinite;
        }

        .level-preview::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 35px;
            background: repeating-linear-gradient(90deg, #2d1b4e 0px, #2d1b4e 25px, #3d2b6e 25px, #3d2b6e 50px);
            animation: groundScroll 2s linear infinite;
        }

        .level-name {
            font-size: 28px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px currentColor;
            animation: textGlow 2s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 10px currentColor; }
            50% { text-shadow: 0 0 20px currentColor, 0 0 30px currentColor; }
        }

        .level-difficulty {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .difficulty-face {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: facePulse 1.5s ease-in-out infinite;
        }

        @keyframes facePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .difficulty-face.easy {
            background: linear-gradient(180deg, #50ff50, #30bb30);
            box-shadow: 0 0 20px #50ff50, 0 0 40px #30bb30;
        }
        .difficulty-face.normal {
            background: linear-gradient(180deg, #ffff50, #bbbb30);
            box-shadow: 0 0 20px #ffff50, 0 0 40px #bbbb30;
        }
        .difficulty-face.hard {
            background: linear-gradient(180deg, #ff8850, #bb5530);
            box-shadow: 0 0 20px #ff8850, 0 0 40px #bb5530;
        }
        .difficulty-face.harder {
            background: linear-gradient(180deg, #ff5050, #bb3030);
            box-shadow: 0 0 20px #ff5050, 0 0 40px #bb3030;
        }
        .difficulty-face.insane {
            background: linear-gradient(180deg, #ff50ff, #bb30bb);
            box-shadow: 0 0 20px #ff50ff, 0 0 40px #bb30bb;
        }
        .difficulty-face.demon {
            background: linear-gradient(180deg, #ff0000, #880000);
            box-shadow: 0 0 20px #ff0000, 0 0 40px #880000;
        }

        .difficulty-text {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 22px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 11px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00ffaa, #00ffff);
            background-size: 200% 100%;
            animation: progressShine 2s linear infinite;
            border-radius: 9px;
            position: relative;
            transition: width 0.5s ease;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
            border-radius: 9px 9px 0 0;
        }

        @keyframes progressShine {
            0% { background-position: 200% 0; }
            100% { background-position: 0% 0; }
        }

        .progress-text {
            margin-top: 8px;
            font-size: 16px;
            color: #aaffaa;
        }

        .level-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .level-btn {
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            border: 3px solid rgba(255,255,255,0.7);
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            color: white;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .normal-btn {
            background: linear-gradient(180deg, #50ff50 0%, #30bb30 50%, #20aa20 100%);
            box-shadow: 0 4px 0 #108010, 0 0 20px rgba(80, 255, 80, 0.4);
        }

        .practice-btn {
            background: linear-gradient(180deg, #50bbff 0%, #3088dd 50%, #2066bb 100%);
            box-shadow: 0 4px 0 #104488, 0 0 20px rgba(80, 187, 255, 0.4);
        }

        .level-btn:hover {
            transform: translateY(-3px);
        }

        .normal-btn:hover {
            box-shadow: 0 6px 0 #108010, 0 0 40px rgba(80, 255, 80, 0.6);
        }

        .practice-btn:hover {
            box-shadow: 0 6px 0 #104488, 0 0 40px rgba(80, 187, 255, 0.6);
        }

        /* Star counter */
        .star-counter {
            position: absolute;
            bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            color: #ffdd00;
            text-shadow: 0 0 15px #ffdd00;
        }

        .star-counter .star {
            font-size: 36px;
            animation: starSpin 3s linear infinite;
        }

        @keyframes starSpin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* ==================== GAME SCREEN ==================== */
        #game-screen {
            background: #000;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
        }

        .game-ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 50;
        }

        .game-progress {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-progress-bar {
            width: 180px;
            height: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .game-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00ffff);
            width: 0%;
            transition: width 0.1s linear;
        }

        .game-progress-text {
            color: white;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            min-width: 45px;
        }

        .pause-btn {
            width: 45px;
            height: 45px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
        }

        .pause-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* Practice UI */
        .practice-ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 25px;
            z-index: 50;
        }

        .practice-ui.active {
            display: flex;
        }

        .practice-btn-game {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid white;
            font-size: 28px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            font-family: inherit;
        }

        .checkpoint-btn {
            background: linear-gradient(180deg, #50ff50, #20aa20);
            box-shadow: 0 4px 0 #108010, 0 0 20px rgba(80, 255, 80, 0.5);
        }

        .remove-btn {
            background: linear-gradient(180deg, #ff5050, #aa2020);
            box-shadow: 0 4px 0 #801010, 0 0 20px rgba(255, 80, 80, 0.5);
        }

        .practice-btn-game:hover {
            transform: scale(1.15);
        }

        /* ==================== OVERLAYS ==================== */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .overlay-content {
            text-align: center;
            color: white;
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .overlay-content h2 {
            font-size: 56px;
            margin-bottom: 40px;
            text-shadow:
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 5px 0 #008888;
            letter-spacing: 8px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        .overlay-buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .overlay-btn {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            border: 3px solid rgba(255,255,255,0.8);
            cursor: pointer;
            font-size: 32px;
            color: white;
            font-family: inherit;
            transition: all 0.2s;
        }

        .resume-btn {
            background: linear-gradient(180deg, #50ff50, #20aa20);
            box-shadow: 0 5px 0 #108010, 0 0 25px rgba(80, 255, 80, 0.5);
        }

        .restart-btn {
            background: linear-gradient(180deg, #ffaa50, #dd7720);
            box-shadow: 0 5px 0 #885510, 0 0 25px rgba(255, 170, 80, 0.5);
        }

        .quit-btn {
            background: linear-gradient(180deg, #ff5050, #aa2020);
            box-shadow: 0 5px 0 #801010, 0 0 25px rgba(255, 80, 80, 0.5);
        }

        .overlay-btn:hover {
            transform: scale(1.15) translateY(-3px);
        }

        /* Death Screen */
        .death-content {
            animation: deathShake 0.4s ease;
        }

        @keyframes deathShake {
            0%, 100% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-15px) rotate(-2deg); }
            40% { transform: translateX(15px) rotate(2deg); }
            60% { transform: translateX(-10px) rotate(-1deg); }
            80% { transform: translateX(10px) rotate(1deg); }
        }

        .attempt-text {
            font-size: 28px;
            margin-bottom: 15px;
            color: #aaaaaa;
        }

        .attempt-text span {
            color: white;
            text-shadow: 0 0 10px white;
        }

        .death-progress {
            font-size: 72px;
            color: #ff4444;
            text-shadow:
                0 0 20px #ff4444,
                0 0 40px #ff0000,
                0 0 60px #ff0000;
            margin-bottom: 40px;
            animation: deathPulse 1s ease-in-out infinite;
        }

        @keyframes deathPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Complete Screen */
        .complete-content h2 {
            font-size: 52px;
            color: #ffdd00;
            text-shadow:
                0 0 20px #ffdd00,
                0 0 40px #ff8800,
                0 0 60px #ff8800,
                0 5px 0 #aa8800;
            margin-bottom: 25px;
            animation: completeGlow 1s ease-in-out infinite alternate;
        }

        @keyframes completeGlow {
            from { filter: brightness(1) drop-shadow(0 0 20px #ffdd00); }
            to { filter: brightness(1.3) drop-shadow(0 0 40px #ffaa00); }
        }

        .stars-display {
            font-size: 70px;
            margin: 25px 0;

        .stars-display .star {
            color: #ffdd00;
            text-shadow: 0 0 30px #ffdd00;

        .stars-display .star:nth-child(1) { animation-delay: 0.2s; }
        .stars-display .star:nth-child(2) { animation-delay: 0.4s; }
        .stars-display .star:nth-child(3) { animation-delay: 0.6s; }

        @keyframes starPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .stats-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 40px;

        /* Music toggle */

</head>
<body>

    <script>
        // ==================== AUDIO SYSTEM ====================
        let audioCtx = null;
        let musicPlaying = false;
        let musicNodes = [];
        let musicMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClick() {
            initAudio();
            playSound('click');
        }

        function playSound(type) {
            if (!audioCtx || musicMuted) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'death') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'complete') {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.4);
                    o.start(audioCtx.currentTime + i * 0.12);
                    o.stop(audioCtx.currentTime + i * 0.12 + 0.4);
                });
            }
        }

        // Main menu music - electronic beat
        function startMenuMusic() {
            if (!audioCtx || musicPlaying || musicMuted) return;
            musicPlaying = true;

            const bpm = 128;
            const beatTime = 60 / bpm;

            function scheduleMusic() {
                if (!musicPlaying) return;

                const now = audioCtx.currentTime;

                // Kick drum
                for (let i = 0; i < 4; i++) {
                    const kickTime = now + i * beatTime;
                    const kick = audioCtx.createOscillator();
                    const kickGain = audioCtx.createGain();
                    kick.connect(kickGain);
                    kickGain.connect(audioCtx.destination);
                    kick.frequency.setValueAtTime(150, kickTime);
                    kick.frequency.exponentialRampToValueAtTime(50, kickTime + 0.1);
                    kickGain.gain.setValueAtTime(0.4, kickTime);
                    kickGain.gain.exponentialRampToValueAtTime(0.01, kickTime + 0.15);
                    kick.start(kickTime);
                    kick.stop(kickTime + 0.15);
                    musicNodes.push(kick);
                }

                // Hi-hat
                for (let i = 0; i < 8; i++) {
                    const hatTime = now + i * beatTime / 2;
                    const bufferSize = audioCtx.sampleRate * 0.05;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let j = 0; j < bufferSize; j++) {
                        data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.1));
                    }
                    const hat = audioCtx.createBufferSource();
                    hat.buffer = buffer;
                    const hatGain = audioCtx.createGain();
                    const hatFilter = audioCtx.createBiquadFilter();
                    hatFilter.type = 'highpass';
                    hatFilter.frequency.value = 8000;
                    hat.connect(hatFilter);
                    hatFilter.connect(hatGain);
                    hatGain.connect(audioCtx.destination);
                    hatGain.gain.setValueAtTime(i % 2 === 0 ? 0.08 : 0.05, hatTime);
                    hat.start(hatTime);
                    musicNodes.push(hat);
                }

                // Snare
                for (let i = 0; i < 2; i++) {
                    const snareTime = now + (i * 2 + 1) * beatTime;
                    const snareOsc = audioCtx.createOscillator();
                    const snareGain = audioCtx.createGain();
                    snareOsc.connect(snareGain);
                    snareGain.connect(audioCtx.destination);
                    snareOsc.frequency.setValueAtTime(200, snareTime);
                    snareOsc.frequency.exponentialRampToValueAtTime(100, snareTime + 0.1);
                    snareGain.gain.setValueAtTime(0.2, snareTime);
                    snareGain.gain.exponentialRampToValueAtTime(0.01, snareTime + 0.15);
                    snareOsc.start(snareTime);
                    snareOsc.stop(snareTime + 0.15);
                    musicNodes.push(snareOsc);

                    // Snare noise
                    const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
                    const noiseData = noiseBuffer.getChannelData(0);
                    for (let j = 0; j < noiseBuffer.length; j++) {
                        noiseData[j] = (Math.random() * 2 - 1) * Math.exp(-j / (noiseBuffer.length * 0.2));
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    const noiseGain = audioCtx.createGain();
                    noise.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);
                    noiseGain.gain.setValueAtTime(0.15, snareTime);
                    noise.start(snareTime);
                    musicNodes.push(noise);
                }

                // Bass line
                const bassNotes = [65.41, 65.41, 82.41, 73.42]; // C2, C2, E2, D2
                bassNotes.forEach((freq, i) => {
                    const bassTime = now + i * beatTime;
                    const bass = audioCtx.createOscillator();
                    const bassGain = audioCtx.createGain();
                    bass.type = 'sawtooth';
                    bass.connect(bassGain);
                    bassGain.connect(audioCtx.destination);
                    bass.frequency.value = freq;
                    bassGain.gain.setValueAtTime(0.12, bassTime);
                    bassGain.gain.exponentialRampToValueAtTime(0.01, bassTime + beatTime * 0.9);
                    bass.start(bassTime);
                    bass.stop(bassTime + beatTime * 0.9);
                    musicNodes.push(bass);
                });

                // Lead melody
                const leadNotes = [523.25, 587.33, 659.25, 587.33, 523.25, 493.88, 523.25, 587.33];
                leadNotes.forEach((freq, i) => {
                    const leadTime = now + i * beatTime / 2;
                    const lead = audioCtx.createOscillator();
                    const leadGain = audioCtx.createGain();
                    lead.type = 'square';
                    lead.connect(leadGain);
                    leadGain.connect(audioCtx.destination);
                    lead.frequency.value = freq;
                    leadGain.gain.setValueAtTime(0.06, leadTime);
                    leadGain.gain.exponentialRampToValueAtTime(0.01, leadTime + beatTime / 2 * 0.8);
                    lead.start(leadTime);
                    lead.stop(leadTime + beatTime / 2 * 0.8);
                    musicNodes.push(lead);
                });

                setTimeout(scheduleMusic, beatTime * 4 * 1000 - 50);
            }

            scheduleMusic();
        }

        function stopMusic() {
            musicPlaying = false;
            musicNodes.forEach(node => {
                try { node.stop(); } catch(e) {}
            });
            musicNodes = [];
        }

        function toggleMusic() {
            musicMuted = !musicMuted;
            document.getElementById('music-toggle').textContent = musicMuted ? '🔇' : '🔊';
            document.getElementById('music-toggle').classList.toggle('muted', musicMuted);

            if (musicMuted) {
                stopMusic();
            } else if (gameState === 'menu') {
                startMenuMusic();
            }
        }

        // ==================== PARTICLES ====================
        const particlesCanvas = document.getElementById('particles-canvas');
        const particlesCtx = particlesCanvas.getContext('2d');
        let particles = [];

        function resizeParticles() {
            particlesCanvas.width = window.innerWidth;
            particlesCanvas.height = window.innerHeight;
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: Math.random() * particlesCanvas.width,
                    y: Math.random() * particlesCanvas.height,
                    size: Math.random() * 4 + 1,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    opacity: Math.random() * 0.5 + 0.2,
                    hue: Math.random() * 60 + 180 // Cyan to purple range
                });
            }
        }

        function updateParticles() {
            particlesCtx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = particlesCanvas.width;
                if (p.x > particlesCanvas.width) p.x = 0;
                if (p.y < 0) p.y = particlesCanvas.height;
                if (p.y > particlesCanvas.height) p.y = 0;

                particlesCtx.beginPath();
                particlesCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                particlesCtx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.opacity})`;
                particlesCtx.fill();

                // Glow effect
                particlesCtx.beginPath();
                particlesCtx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
                particlesCtx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.opacity * 0.3})`;
                particlesCtx.fill();
            });

            requestAnimationFrame(updateParticles);
        }

        // ==================== GAME DATA ====================
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        const LEVELS = [
            { id: 1, name: "Stereo Madness", difficulty: "easy", stars: 1, color: { bg1: '#0066cc', bg2: '#003366', ground: '#2d1b4e' }, length: 6000 },
            { id: 2, name: "Back On Track", difficulty: "easy", stars: 2, color: { bg1: '#006644', bg2: '#003322', ground: '#1b4e2d' }, length: 6500 },
            { id: 3, name: "Polargeist", difficulty: "normal", stars: 3, color: { bg1: '#440066', bg2: '#220033', ground: '#3d1b4e' }, length: 7000 },
            { id: 4, name: "Dry Out", difficulty: "normal", stars: 4, color: { bg1: '#664400', bg2: '#332200', ground: '#4e3d1b' }, length: 7500 },
            { id: 5, name: "Base After Base", difficulty: "hard", stars: 5, color: { bg1: '#006666', bg2: '#003333', ground: '#1b4e4e' }, length: 8000 },
            { id: 6, name: "Can't Let Go", difficulty: "hard", stars: 6, color: { bg1: '#660044', bg2: '#330022', ground: '#4e1b3d' }, length: 8500 },
            { id: 7, name: "Jumper", difficulty: "harder", stars: 7, color: { bg1: '#444400', bg2: '#222200', ground: '#4e4e1b' }, length: 9000 },
            { id: 8, name: "Time Machine", difficulty: "harder", stars: 8, color: { bg1: '#004466', bg2: '#002233', ground: '#1b3d4e' }, length: 9500 },
            { id: 9, name: "Cycles", difficulty: "harder", stars: 9, color: { bg1: '#660000', bg2: '#330000', ground: '#4e1b1b' }, length: 10000 },
            { id: 10, name: "xStep", difficulty: "insane", stars: 10, color: { bg1: '#440044', bg2: '#220022', ground: '#3d1b3d' }, length: 11000 }
        ];

        const difficultyFaces = {
            easy: '😊', normal: '😐', hard: '😠', harder: '😡', insane: '🤯', demon: '👿'
        };

        // Game state
        let gameState = 'loading';
        let currentLevelIndex = 0;
        let currentLevel = LEVELS[0];
        let practiceMode = false;
        let attempts = 0;
        let jumpCount = 0;
        let startTime = 0;

        // Player
        let player = {
            x: 100, y: 0, width: 42, height: 42,
            velocityY: 0, rotation: 0, isOnGround: true, isDead: false,
            primaryColor: '#00ff00', secondaryColor: '#00ffff',
            trail: []
        };

        const GRAVITY = 0.85;
        const JUMP_FORCE = -14.5;
        const GAME_SPEED = 8.5;

        let cameraX = 0;
        let groundY = 0;
        let obstacles = [];
        let checkpoints = [];
        let lastCheckpoint = null;
        let isHolding = false;
        let canJump = true;
        let deathParticles = [];

        // ==================== UI FUNCTIONS ====================
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showMenu() {
            initAudio();
            playClick();
            gameState = 'menu';
            showScreen('main-menu');
            startMenuMusic();
        }

        function showLevelSelect() {
            initAudio();
            playClick();
            updateLevelDisplay();
            showScreen('level-select');
        }

        function changeLevel(dir) {
            playClick();
            currentLevelIndex += dir;
            if (currentLevelIndex < 0) currentLevelIndex = LEVELS.length - 1;
            if (currentLevelIndex >= LEVELS.length) currentLevelIndex = 0;
            updateLevelDisplay();
        }

        function updateLevelDisplay() {
            currentLevel = LEVELS[currentLevelIndex];
            document.getElementById('level-name').textContent = currentLevel.name;
            document.getElementById('difficulty-text').textContent =
                currentLevel.difficulty.charAt(0).toUpperCase() + currentLevel.difficulty.slice(1);

            const face = document.getElementById('difficulty-face');
            face.className = 'difficulty-face ' + currentLevel.difficulty;
            face.textContent = difficultyFaces[currentLevel.difficulty];

            // Level preview background
            document.getElementById('level-preview-bg').style.background =
                `linear-gradient(180deg, ${currentLevel.color.bg1} 0%, ${currentLevel.color.bg2} 100%)`;

            const progress = localStorage.getItem('gd_progress_' + currentLevel.id) || 0;
            document.getElementById('level-progress').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `Normal: ${progress}%`;

            // Update total stars
            let totalStars = 0;
            LEVELS.forEach(l => {
                if (localStorage.getItem('gd_progress_' + l.id) >= 100) {
                    totalStars += l.stars;
                }
            });
            document.getElementById('total-stars').textContent = totalStars;
        }

        function startGame(practice) {
            playClick();
            practiceMode = practice;
            attempts = 0;
            jumpCount = 0;
            checkpoints = [];
            lastCheckpoint = null;
            startTime = Date.now();
            deathParticles = [];

            resize();
            generateObstacles();
            resetPlayer();
            attempts++;

            document.getElementById('attempt-count').textContent = attempts;
            document.getElementById('practice-ui').classList.toggle('active', practice);

            stopMusic();
            gameState = 'playing';
            showScreen('game-screen');
            hideOverlays();
            gameLoop();
        }

        function pauseGame() {
            if (gameState === 'playing') {
                playClick();
                gameState = 'paused';
                document.getElementById('pause-overlay').classList.add('active');
            }
        }

        function resumeGame() {
            playClick();
            gameState = 'playing';
            hideOverlays();
            gameLoop();
        }

        function restartGame() {
            playClick();
            hideOverlays();
            resetPlayer();
            attempts++;
            jumpCount = 0;
            deathParticles = [];
            startTime = Date.now();
            document.getElementById('attempt-count').textContent = attempts;
            gameState = 'playing';
            gameLoop();
        }

        function quitGame() {
            playClick();
            gameState = 'menu';
            hideOverlays();
            showLevelSelect();
            startMenuMusic();
        }

        function hideOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
        }

        function addCheckpoint() {
            if (!practiceMode || gameState !== 'playing') return;
            lastCheckpoint = { cameraX, playerX: player.x, playerY: player.y };
            checkpoints.push({...lastCheckpoint});
            playSound('jump');
        }

        function removeCheckpoint() {
            if (!practiceMode) return;
            playClick();
            checkpoints.pop();
            lastCheckpoint = checkpoints[checkpoints.length - 1] || null;
        }

        // ==================== GAME LOGIC ====================
        function generateObstacles() {
            obstacles = [];
            const blockSize = 40;
            let x = 500;
            const length = currentLevel.length;

            while (x < length - 300) {
                const type = Math.random();

                if (type < 0.35) {
                    const count = 1 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < count; i++) {
                        obstacles.push({ type: 'spike', x: x + i * blockSize, y: groundY - blockSize, width: blockSize, height: blockSize });
                    }
                    x += count * blockSize + 180 + Math.random() * 120;
                } else if (type < 0.6) {
                    const count = 1 + Math.floor(Math.random() * 3);
                    const height = 1 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < count; i++) {
                        for (let h = 0; h < height; h++) {
                            obstacles.push({ type: 'block', x: x + i * blockSize, y: groundY - blockSize - h * blockSize, width: blockSize, height: blockSize });
                        }
                    }
                    if (Math.random() < 0.4) {
                        obstacles.push({ type: 'spike', x: x + Math.floor(count/2) * blockSize, y: groundY - blockSize - height * blockSize, width: blockSize, height: blockSize });
                    }
                    x += count * blockSize + 140 + Math.random() * 100;
                } else if (type < 0.75) {
                    obstacles.push({ type: 'pad', x, y: groundY - 18, width: 45, height: 18 });
                    x += 180;
                    obstacles.push({ type: 'spike', x, y: groundY - blockSize, width: blockSize, height: blockSize });
                    obstacles.push({ type: 'spike', x: x + blockSize, y: groundY - blockSize, width: blockSize, height: blockSize });
                    x += 180;
                } else if (type < 0.9) {
                    obstacles.push({ type: 'orb', x, y: groundY - 110, width: 38, height: 38, triggered: false });
                    obstacles.push({ type: 'spike', x: x - 20, y: groundY - blockSize, width: blockSize, height: blockSize });
                    obstacles.push({ type: 'spike', x: x + 20, y: groundY - blockSize, width: blockSize, height: blockSize });
                    x += 220;
                } else {
                    obstacles.push({ type: 'coin', x, y: groundY - 120, width: 28, height: 28, collected: false });
                    x += 150;
                }
            }

            obstacles.push({ type: 'end', x: length - 100, y: 0, width: 50, height: canvas.height });
        }

        function resetPlayer() {
            if (practiceMode && lastCheckpoint) {
                cameraX = lastCheckpoint.cameraX;
                player.x = lastCheckpoint.playerX;
                player.y = lastCheckpoint.playerY;
            } else {
                cameraX = 0;
                player.x = 100;
                player.y = groundY - player.height;
            }
            player.velocityY = 0;
            player.rotation = 0;
            player.isOnGround = true;
            player.isDead = false;
            player.trail = [];
            canJump = true;
            deathParticles = [];

            obstacles.forEach(obs => {
                if (obs.type === 'orb') obs.triggered = false;
                if (obs.type === 'coin') obs.collected = false;
            });
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height - 100;
        }

        function die() {
            player.isDead = true;
            gameState = 'dead';
            playSound('death');

            // Create death particles
            for (let i = 0; i < 25; i++) {
                const angle = (Math.PI * 2 / 25) * i;
                const speed = 5 + Math.random() * 10;
                deathParticles.push({
                    x: player.x - cameraX + player.width / 2,
                    y: player.y + player.height / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 5 + Math.random() * 12,
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 20,
                    alpha: 1,
                    color: Math.random() > 0.5 ? player.primaryColor : player.secondaryColor
                });
            }

            const progress = Math.floor((cameraX / currentLevel.length) * 100);
            document.getElementById('death-progress').textContent = progress + '%';

            const saved = parseInt(localStorage.getItem('gd_progress_' + currentLevel.id) || 0);
            if (progress > saved) {
                localStorage.setItem('gd_progress_' + currentLevel.id, progress);
            }

            setTimeout(() => {
                document.getElementById('death-overlay').classList.add('active');
            }, 500);
        }

        function complete() {
            gameState = 'complete';
            playSound('complete');

            localStorage.setItem('gd_progress_' + currentLevel.id, 100);

            document.getElementById('complete-attempts').textContent = attempts;
            document.getElementById('complete-jumps').textContent = jumpCount;

            const elapsed = Date.now() - startTime;
            const secs = Math.floor(elapsed / 1000);
            document.getElementById('complete-time').textContent = `${Math.floor(secs/60)}:${(secs%60).toString().padStart(2,'0')}`;

            setTimeout(() => {
                document.getElementById('complete-overlay').classList.add('active');
            }, 300);
        }

        function checkCollision(a, b) {
            const margin = 7;
            return a.x + margin < b.x + b.width &&
                   a.x + a.width - margin > b.x &&
                   a.y + margin < b.y + b.height &&
                   a.y + a.height - margin > b.y;
        }

        // ==================== GAME LOOP ====================
        function update() {
            if (gameState !== 'playing') return;

            cameraX += GAME_SPEED;
            player.x = cameraX + 100;

            player.velocityY += GRAVITY;
            player.y += player.velocityY;

            // Add trail
            player.trail.push({ x: player.x - cameraX + player.width/2, y: player.y + player.height/2, alpha: 1 });
            if (player.trail.length > 15) player.trail.shift();
            player.trail.forEach(t => t.alpha -= 0.07);

            if (player.y >= groundY - player.height) {
                player.y = groundY - player.height;
                player.velocityY = 0;
                player.isOnGround = true;
                player.rotation = Math.round(player.rotation / 90) * 90;
            } else {
                player.isOnGround = false;
            }

            if (isHolding && player.isOnGround && canJump) {
                player.velocityY = JUMP_FORCE;
                player.isOnGround = false;
                canJump = false;
                jumpCount++;
                playSound('jump');
            }

            if (!isHolding) canJump = true;

            if (!player.isOnGround) {
                player.rotation += 8;
            }

            // Collisions
            for (const obs of obstacles) {
                if (obs.x > cameraX + canvas.width + 100 || obs.x + obs.width < cameraX - 100) continue;

                const hit = checkCollision(player, obs);

                if (obs.type === 'spike' && hit) { die(); return; }

                if (obs.type === 'block' && hit) {
                    const playerBottom = player.y + player.height;
                    const playerRight = player.x + player.width;

                    if (player.velocityY > 0 && playerBottom > obs.y && playerBottom < obs.y + obs.height/2 && playerRight > obs.x + 5 && player.x < obs.x + obs.width - 5) {
                        player.y = obs.y - player.height;
                        player.velocityY = 0;
                        player.isOnGround = true;
                        player.rotation = Math.round(player.rotation / 90) * 90;
                    } else if (playerRight > obs.x && player.x < obs.x + 8) {
                        die(); return;
                    }
                }

                if (obs.type === 'pad' && hit) {
                    player.velocityY = -19;
                    player.isOnGround = false;
                    playSound('jump');
                }

                if (obs.type === 'orb' && hit && isHolding && !obs.triggered) {
                    obs.triggered = true;
                    player.velocityY = -14.5;
                    jumpCount++;
                    playSound('jump');
                }

                if (obs.type === 'coin' && hit && !obs.collected) {
                    obs.collected = true;
                    playSound('click');
                }

                if (obs.type === 'end' && player.x + player.width > obs.x) {
                    complete(); return;
                }
            }

            const progress = Math.floor((cameraX / currentLevel.length) * 100);
            document.getElementById('game-progress-fill').style.width = progress + '%';
            document.getElementById('game-progress-text').textContent = progress + '%';
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, currentLevel.color.bg1);
            gradient.addColorStop(1, currentLevel.color.bg2);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 15; i++) {
                const y = (i * 60 + (cameraX * 0.1) % 60);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            for (let i = 0; i < 25; i++) {
                const x = (i * 80 - (cameraX * 0.05) % 80);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Draw obstacles
            obstacles.forEach(obs => {
                const screenX = obs.x - cameraX;
                if (screenX < -100 || screenX > canvas.width + 100) return;

                if (obs.type === 'spike') {
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.moveTo(screenX, obs.y + obs.height);
                    ctx.lineTo(screenX + obs.width/2, obs.y);
                    ctx.lineTo(screenX + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#2a2a4e';
                    ctx.beginPath();
                    ctx.moveTo(screenX + obs.width*0.2, obs.y + obs.height);
                    ctx.lineTo(screenX + obs.width/2, obs.y + obs.height*0.25);
                    ctx.lineTo(screenX + obs.width*0.8, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(screenX, obs.y + obs.height);
                    ctx.lineTo(screenX + obs.width/2, obs.y);
                    ctx.lineTo(screenX + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.stroke();
                }

                if (obs.type === 'block') {
                    ctx.fillStyle = currentLevel.color.ground;
                    ctx.fillRect(screenX, obs.y, obs.width, obs.height);

                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.fillRect(screenX, obs.y, obs.width, obs.height * 0.3);

                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.fillRect(screenX, obs.y + obs.height * 0.7, obs.width, obs.height * 0.3);

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX, obs.y, obs.width, obs.height);
                }

                if (obs.type === 'pad') {
                    const glow = ctx.createRadialGradient(screenX + obs.width/2, obs.y + obs.height/2, 0, screenX + obs.width/2, obs.y + obs.height/2, obs.width);
                    glow.addColorStop(0, 'rgba(255, 255, 0, 0.3)');
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.fillRect(screenX - 20, obs.y - 20, obs.width + 40, obs.height + 40);

                    ctx.fillStyle = 'linear-gradient(180deg, #ffff00, #ffaa00)';
                    ctx.fillStyle = '#ffff00';
                    ctx.fillRect(screenX, obs.y, obs.width, obs.height);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX, obs.y, obs.width, obs.height);

                    // Arrow
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(screenX + obs.width/2, obs.y + 3);
                    ctx.lineTo(screenX + 8, obs.y + obs.height - 3);
                    ctx.lineTo(screenX + obs.width - 8, obs.y + obs.height - 3);
                    ctx.closePath();
                    ctx.fill();
                }

                if (obs.type === 'orb') {
                    const cx = screenX + obs.width/2;
                    const cy = obs.y + obs.height/2;
                    const pulse = 1 + Math.sin(Date.now() * 0.008) * 0.15;
                    const color = obs.triggered ? '#666600' : '#ffff00';

                    // Glow
                    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, obs.width * pulse);
                    glow.addColorStop(0, obs.triggered ? 'rgba(100, 100, 0, 0.5)' : 'rgba(255, 255, 0, 0.5)');
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(cx, cy, obs.width * pulse, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(cx, cy, obs.width/2 * pulse, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Highlight
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 5, 5, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (obs.type === 'coin' && !obs.collected) {
                    const cx = screenX + obs.width/2;
                    const cy = obs.y + obs.height/2;
                    const scale = Math.cos(Date.now() * 0.006);

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.scale(scale, 1);

                    ctx.fillStyle = '#ffdd00';
                    ctx.beginPath();
                    ctx.arc(0, 0, obs.width/2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffff88';
                    ctx.beginPath();
                    ctx.arc(0, 0, obs.width/3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, obs.width/2, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.restore();
                }

                if (obs.type === 'end') {
                    const endGradient = ctx.createLinearGradient(screenX, 0, screenX + obs.width, 0);
                    endGradient.addColorStop(0, 'transparent');
                    endGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
                    endGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = endGradient;
                    ctx.fillRect(screenX, 0, obs.width, canvas.height);
                }
            });

            // Draw ground
            const blockSize = 40;
            const startX = Math.floor(cameraX / blockSize) * blockSize;
            for (let row = 0; row < 3; row++) {
                for (let col = -1; col <= Math.ceil(canvas.width / blockSize) + 1; col++) {
                    const x = startX + col * blockSize - cameraX;
                    const y = groundY + row * blockSize;
                    const isLight = (Math.floor((startX + col * blockSize) / blockSize) + row) % 2 === 0;

                    ctx.fillStyle = isLight ? currentLevel.color.ground : shadeColor(currentLevel.color.ground, -15);
                    ctx.fillRect(x, y, blockSize, blockSize);

                    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, blockSize, blockSize);
                }
            }

            // Ground line with glow
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 10;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw death particles
            deathParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5;
                p.rotation += p.rotSpeed;
                p.alpha -= 0.02;

                if (p.alpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    ctx.restore();
                }
            });

            // Draw player
            if (!player.isDead) {
                const screenX = player.x - cameraX;

                // Trail
                player.trail.forEach((t, i) => {
                    if (t.alpha > 0) {
                        const trailGradient = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 20);
                        trailGradient.addColorStop(0, `rgba(0, 255, 255, ${t.alpha * 0.5})`);
                        trailGradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = trailGradient;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, 20, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                ctx.save();
                ctx.translate(screenX + player.width/2, player.y + player.height/2);
                ctx.rotate(player.rotation * Math.PI / 180);

                // Glow
                ctx.shadowColor = player.primaryColor;
                ctx.shadowBlur = 15;

                // Body
                ctx.fillStyle = player.primaryColor;
                ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);

                // Inner
                ctx.fillStyle = player.secondaryColor;
                ctx.fillRect(-player.width/3, -player.height/3, player.width/1.5, player.height/1.5);

                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(-player.width/2 + 3, -player.height/2 + 3, player.width/2.5, player.height/3);

                // Outline
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(-player.width/2, -player.height/2, player.width, player.height);

                // Eye
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(player.width/6, -player.height/8, player.width/5.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(player.width/6 + 2, -player.height/8, player.width/9, 0, Math.PI * 2);
                ctx.fill();

                // Eye shine
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(player.width/6 + 4, -player.height/8 - 2, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, Math.max(0, (num >> 16) + amt));
            const G = Math.min(255, Math.max(0, (num >> 8 & 0x00FF) + amt));
            const B = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function gameLoop() {
            if (gameState === 'playing') {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            } else if (gameState === 'dead') {
                draw();
                if (deathParticles.some(p => p.alpha > 0)) {
                    requestAnimationFrame(gameLoop);
                }
            }
        }

        // ==================== INPUT ====================
        window.addEventListener('mousedown', () => { isHolding = true; });
        window.addEventListener('mouseup', () => { isHolding = false; });
        window.addEventListener('touchstart', (e) => { e.preventDefault(); isHolding = true; }, { passive: false });
        window.addEventListener('touchend', () => { isHolding = false; });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') {
                isHolding = true;
                e.preventDefault();
            }
            if (e.code === 'Escape') {
                if (gameState === 'playing') pauseGame();
                else if (gameState === 'paused') resumeGame();
            }
            if (e.code === 'KeyR' && (gameState === 'dead' || gameState === 'paused')) {
                restartGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') {
                isHolding = false;
            }
        });

        window.addEventListener('resize', () => {
            resize();
            resizeParticles();
        });

        // ==================== INIT ====================
        function init() {
            resize();
            resizeParticles();
            initParticles();
            updateParticles();

            // Loading animation
            let progress = 0;
            const loadingBar = document.getElementById('loading-bar');
            const loadInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadInterval);
                    setTimeout(() => {
                        initAudio();
                        showMenu();
                    }, 500);
                }
                loadingBar.style.width = progress + '%';
            }, 100);
        }

        init();
    </script>
</body>
</html>
